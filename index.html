<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>trip-planner</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="top">
    <input id="tripName" class="trip-name" placeholder="旅の名前（例：秋の京都）" />
  </header>

  <!-- 日タブ -->
  <nav id="dayTabs" class="day-tabs"></nav>

  <!-- 1日の設定とゆったり度 -->
  <section class="card">
    <div class="row">
      <label>出発 <input id="dayStart" type="time" /></label>
      <label>出発地 <input id="dayOrigin" placeholder="宿" /></label>
      <label>終了 <input id="dayEnd" type="time" /></label>
    </div>
    <div id="meter" class="meter"></div>
  </section>

  <!-- タイムライン -->
  <section class="card">
    <h2>📅 <span id="dayTitle">1日目</span> の予定</h2>
    <ol id="timeline" class="timeline"></ol>
    <p class="hint">候補箱から ↓↑ ドラッグ、または「＋」で追加</p>
  </section>

  <!-- 候補箱 -->
  <section class="card">
    <h2>📋 候補箱</h2>
    <form id="addForm" class="add-form">
      <input id="newName" placeholder="場所の名前" required />
      <input id="newUrl" placeholder="GoogleマップのURL（任意）" inputmode="url" />
      <button type="submit">追加</button>
    </form>
    <ul id="pool" class="pool"></ul>
  </section>

  <!-- AIしおり -->
  <section class="card">
    <h2>📖 AIしおり</h2>
    <p class="hint" style="margin:0 0 10px">今の旅程をAI（Gemini）に渡して、読みやすい「しおり」文章を作ります</p>
    <div class="row">
      <button id="shioriBtn" class="primary" type="button">🪄 しおりを作る</button>
      <button id="shioriKeyBtn" type="button">🔑 キー変更</button>
    </div>
    <p id="shioriStatus" class="hint" style="display:none"></p>
    <div id="shioriResult" class="shiori-result" hidden>
      <pre id="shioriText"></pre>
      <button id="shioriCopyBtn" type="button">📋 コピー</button>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
